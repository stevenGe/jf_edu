{% extends "parent/base_parent.html" %}
{% block content %}
<h2>✍️ 手动记账</h2>

{% if error %}<div class="banner warn">{{ error }}</div>{% endif %}
{% if child is none %}
<div class="banner warn">还没有孩子账号，无法记账。</div>
{% else %}
<div class="card">
  <form method="post" action="/parent/entry" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>给 <b>{{ child.name }}</b> 记一笔</label>

    <label for="rule_id">选择规则（可选，用于展示名称）</label>
    <select name="rule_id" id="rule_id">
      <option value="">—— 自定义 ——</option>
      {% for r in rules %}
      <option value="{{ r.id }}" data-points="{{ r.points }}">{{ r.icon }} {{ r.name }}（+{{ r.points }}）</option>
      {% endfor %}
    </select>

    <label for="points">分值（正数加分，负数扣分；选了规则可留空）</label>
    <input type="number" name="points" id="points" placeholder="如 2 或 -1">

    <label for="note">备注（必填）</label>
    <textarea name="note" id="note" rows="2" required placeholder="比如：主动帮忙摆碗筷 / 忘带作业本"></textarea>

    <button class="btn primary">入账</button>
  </form>
</div>
<script>
  // 选中规则时自动带出分值，可手动覆盖
  document.getElementById('rule_id').addEventListener('change', function () {
    var opt = this.options[this.selectedIndex];
    var pts = document.getElementById('points');
    if (opt.dataset.points && !pts.value) { pts.value = opt.dataset.points; }
  });
</script>
{% endif %}
{% endblock %}
